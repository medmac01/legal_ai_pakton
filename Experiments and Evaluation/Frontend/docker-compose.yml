version: '3.9'

services:
  evaluation-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NPM_INSTALL_FLAGS=--legacy-peer-deps
    container_name: pakton-evaluation-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./src:/app/src  # For development hot-reloading
      - ./public:/app/public
    restart: unless-stopped